<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <!-- Denna rad gör att sidan skalas rätt på mobiler istället för att visas som en zoomad-ut "datorsida" -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hundålder-kalkylator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Flaggorna ritas som inbäddad SVG istället för emoji, eftersom
       Windows standardteckensnitt inte visar flagg-emojis som bilder
       (bara landskoden som text), och en vanlig <select> inte kan
       visa bilder i sina alternativ. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="flag-se" viewBox="0 0 16 10">
      <rect width="16" height="10" fill="#006AA7"/>
      <rect x="5" width="2" height="10" fill="#FECC02"/>
      <rect y="4" width="16" height="2" fill="#FECC02"/>
    </symbol>
    <symbol id="flag-gb" viewBox="0 0 20 12">
      <rect width="20" height="12" fill="#00247D"/>
      <path d="M0,0 L20,12 M20,0 L0,12" stroke="#FFFFFF" stroke-width="2.4"/>
      <path d="M0,0 L20,12 M20,0 L0,12" stroke="#CF142B" stroke-width="0.8"/>
      <rect x="8" width="4" height="12" fill="#FFFFFF"/>
      <rect y="4" width="20" height="4" fill="#FFFFFF"/>
      <rect x="8.8" width="2.4" height="12" fill="#CF142B"/>
      <rect y="4.8" width="20" height="2.4" fill="#CF142B"/>
    </symbol>
    <symbol id="flag-us" viewBox="0 0 19 10">
      <rect width="19" height="10" fill="#B22234"/>
      <rect y="0.77" width="19" height="0.77" fill="#FFFFFF"/>
      <rect y="2.31" width="19" height="0.77" fill="#FFFFFF"/>
      <rect y="3.85" width="19" height="0.77" fill="#FFFFFF"/>
      <rect y="5.39" width="19" height="0.77" fill="#FFFFFF"/>
      <rect y="6.93" width="19" height="0.77" fill="#FFFFFF"/>
      <rect y="8.47" width="19" height="0.77" fill="#FFFFFF"/>
      <rect width="8" height="5.39" fill="#3C3B6E"/>
    </symbol>
    <symbol id="flag-de" viewBox="0 0 16 10">
      <rect width="16" height="3.33" fill="#000000"/>
      <rect y="3.33" width="16" height="3.33" fill="#DD0000"/>
      <rect y="6.66" width="16" height="3.34" fill="#FFCE00"/>
    </symbol>
    <symbol id="flag-fr" viewBox="0 0 16 10">
      <rect width="5.33" height="10" fill="#0055A4"/>
      <rect x="5.33" width="5.33" height="10" fill="#FFFFFF"/>
      <rect x="10.66" width="5.34" height="10" fill="#EF4135"/>
    </symbol>
  </svg>

  <main class="card">
    <div class="top-bar">
      <button type="button" id="stats-toggle" class="icon-button" aria-pressed="false" aria-label="Statistik" title="Statistik">
        <svg class="stats-icon" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="2" y="10" width="4" height="8" rx="1"/>
          <rect x="8" y="5" width="4" height="13" rx="1"/>
          <rect x="14" y="2" width="4" height="16" rx="1"/>
        </svg>
      </button>
      <div class="lang-switcher" id="lang-switcher">
        <button type="button" id="lang-button" class="lang-button" aria-haspopup="listbox" aria-expanded="false">
          <svg class="flag-icon" aria-hidden="true"><use id="lang-button-flag" href="#flag-se"></use></svg>
          <span id="lang-button-label">Svenska</span>
          <svg class="chevron" viewBox="0 0 10 6" aria-hidden="true">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </svg>
        </button>
        <ul id="lang-listbox" class="lang-listbox" role="listbox" aria-label="Välj språk / Choose language" tabindex="-1" hidden>
          <li role="option" data-lang="sv" aria-selected="true" tabindex="-1">
            <svg class="flag-icon" aria-hidden="true"><use href="#flag-se"></use></svg>
            <span>Svenska</span>
          </li>
          <li role="option" data-lang="en-GB" aria-selected="false" tabindex="-1">
            <svg class="flag-icon" aria-hidden="true"><use href="#flag-gb"></use></svg>
            <span>English (UK)</span>
          </li>
          <li role="option" data-lang="en-US" aria-selected="false" tabindex="-1">
            <svg class="flag-icon" aria-hidden="true"><use href="#flag-us"></use></svg>
            <span>English (US)</span>
          </li>
          <li role="option" data-lang="de" aria-selected="false" tabindex="-1">
            <svg class="flag-icon" aria-hidden="true"><use href="#flag-de"></use></svg>
            <span>Deutsch</span>
          </li>
          <li role="option" data-lang="fr" aria-selected="false" tabindex="-1">
            <svg class="flag-icon" aria-hidden="true"><use href="#flag-fr"></use></svg>
            <span>Français</span>
          </li>
        </ul>
      </div>
    </div>

    <div id="stats-panel" class="stats-panel" hidden>
      <h2 id="stats-title">Statistik över sajtens användning</h2>
      <p id="stats-status" class="stats-status" hidden></p>
      <div class="chart-block">
        <h3 id="stats-age-title">Uträkningar per hundålder</h3>
        <div id="stats-age-chart" class="bar-chart"></div>
      </div>
      <div class="chart-block">
        <h3 id="stats-size-title">Uträkningar per hundstorlek</h3>
        <div id="stats-size-chart" class="bar-chart"></div>
      </div>
    </div>

    <h1 id="app-title">🐶 Hundålder-kalkylator</h1>
    <p class="subtitle" id="subtitle">Räkna ut din hunds ålder i "människoår"</p>

    <form id="age-form">
      <label for="dog-age" id="age-label">Hundens ålder (år)</label>
      <input
        type="number"
        id="dog-age"
        name="dog-age"
        min="0"
        step="0.5"
        placeholder="t.ex. 3"
        inputmode="decimal"
        required
      >

      <label for="dog-size" id="size-label">Hundens storlek</label>
      <select id="dog-size" name="dog-size">
        <option id="opt-small" value="small">Liten (upp till 10 kg)</option>
        <option id="opt-medium" value="medium" selected>Mellan (10–25 kg)</option>
        <option id="opt-large" value="large">Stor (25–40 kg)</option>
        <option id="opt-giant" value="giant">Jätte (över 40 kg)</option>
      </select>

      <button type="submit" id="submit-btn">Beräkna</button>
    </form>

    <p id="error" class="error" hidden>Ange en giltig ålder (0 eller högre).</p>

    <div id="result" class="result" hidden>
      <p class="result-number"></p>
      <p class="result-text"></p>
    </div>
  </main>

  <footer class="version-info" id="version-info">v04.00.00 · 2026-09-14 20:15</footer>

  <script src="script.js"></script>
</body>
</html>
